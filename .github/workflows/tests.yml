name: Offline workflow tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo_workflow.py --out runs/ci-demo
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install twice and smoke test outside checkout
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'eso install smoke'
          skill, runtime, bins = root / 'skills/eso', root / 'runtime', root / 'bin'
          command = [sys.executable, 'scripts/install.py', '--skill-dir', str(skill),
                     '--runtime-dir', str(runtime), '--bin-dir', str(bins)]
          subprocess.run(command + ['--dry-run'], check=True)
          subprocess.run(command, check=True)
          subprocess.run(command, check=True)
          windows = os.name == 'nt'
          python = runtime / 'venv' / ('Scripts/python.exe' if windows else 'bin/python')
          launcher = bins / ('eso.cmd' if windows else 'eso')
          def launch(args):
              command = [str(launcher), *args]
              if windows:
                  # /s strips one outer pair; preserve the quoted batch path and argument paths.
                  command = 'cmd /d /s /c "' + subprocess.list2cmdline(command) + '"'
              subprocess.run(command, cwd=root, check=True)
          launch(['--version'])
          subprocess.run([str(python), str(skill / 'scripts/demo_workflow.py'),
                          '--out', str(root / 'demo')], cwd=root, check=True)
          launch(['assess', str(skill / 'examples/requirements.json')])
